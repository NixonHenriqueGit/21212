# Workflow para build e deploy automático no GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Build da aplicação para produção
        run: npm run build

      - name: Preparar roteamento SPA para GitHub Pages (.nojekyll & 404.html)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html || true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload dos artefatos estáticos (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
